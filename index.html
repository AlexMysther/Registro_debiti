<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Registro dei Debiti</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Caveat:wght@600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-in">
    <div class="brand">
      <b>Registro dei debiti</b>
      <span id="subtitle">Il quaderno del bar</span>
    </div>
    <div class="grand"><span id="grandTotal">0,00 €</span><small id="grandLabel">totale da incassare</small></div>
    <button class="iconbtn" id="btnSync" title="Sincronizzazione fra telefoni" aria-label="Sincronizzazione fra telefoni">☁</button>
    <button class="iconbtn" id="btnPrint" title="Stampa il registro" aria-label="Stampa il registro">⎙</button>
    <button class="iconbtn" id="btnSettings" title="Prezzi e backup" aria-label="Prezzi e backup">☰</button>
  </div>
</header>

<main class="sheet" id="sheet">
  <div class="sheet-head"><span>Nome</span><span>Conto</span><span>Totale</span></div>
  <div id="rows"></div>
  <div class="totalrow"><b>Totale registro</b><span class="v" id="sheetTotal">0,00 €</span></div>
</main>

<div class="newrow"><button class="bigbtn" id="btnNew">+ Nuovo debitore — scrivi il nome a mano</button></div>

<footer class="foot">
  <span id="savedNote">I dati restano su questo dispositivo.</span>
  <button id="btnBackupFoot">Backup / ripristino</button>
</footer>

<script src="firebase-config.js"></script>
<script type="module" src="sync.js"></script>

<div class="overlay" id="overlay" hidden><div class="panel" id="panel" role="dialog" aria-modal="true"></div></div>

<script src="app.js"></script>
</body>
</html>
